<script>(function(){var b=document.querySelector('.mode'),r=document.documentElement,q=matchMedia('(prefers-color-scheme: dark)');
function sync(){var m=r.dataset.mode;b.setAttribute('aria-label',m==='dark'?'Switch to light mode':'Switch to dark mode');document.querySelector('meta[name=theme-color]').content=m==='dark'?'#0B1424':'#F4EFE6'}
b.hidden=false;sync();
b.addEventListener('click',function(){var next=r.dataset.mode==='dark'?'light':'dark',sys=q.matches?'dark':'light';
r.dataset.mode=next;if(next===sys){delete r.dataset.theme;try{localStorage.removeItem('galley-theme')}catch(e){}}else{r.dataset.theme=next;try{localStorage.setItem('galley-theme',next)}catch(e){}}sync()});
q.addEventListener('change',function(e){if(!r.dataset.theme){r.dataset.mode=e.matches?'dark':'light';sync()}});})();</script>
